# Auto-merge pull requests from Cloud Agent branches (cursor/*) to reduce manual merges on mobile.
# One-time: merge this workflow to main yourself; after that, new cursor/* PRs merge on open.
name: Auto-merge cursor agent PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge agent PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: "squash",
            });
